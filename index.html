<!doctype html>
<html lang="pl" class="h-full bg-gray-50">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator dni życia</title>
  </head>

  <body class="h-full antialiased text-gray-900 py-12 px-4 sm:px-6 lg:px-8">

    <div id="app" class="max-w-md w-full mx-auto bg-white border border-gray-200 rounded-xl p-6 sm:p-8 shadow-sm">

      <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-primary tracking-tight text-gray-900 sm:text-3xl">
          Kalkulator dni życia
        </h1>
      </header>
      <main>
        <form id="form" class="space-y-4">
          <div>
            <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Podaj datę urodzenia *</label>
            <input type="date" name="date" id="date" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
          </div>

          <div class="pt-2">
            <button type="submit"
              class="w-full bg-blue-300 hover:bg-blue-400 text-blue-900 font-semibold p-4 rounded-lg shadow-sm transition duration-150 ease-in-out text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
              Oblicz
            </button>
          </div>
        </form>
    </div>
    </main>

    <dialog id="dialog"
      class="relative bg-gray-200 p-8 border border-gray-300 rounded-md shadow-md backdrop:bg-gray-900/40">

      <button id="close"
        class="absolute top-1 right-3 text-2xl border-none focus-visible:outline-none text-gray-500 hover:text-gray-700 transition-colors">&times;</button>

      <div class="text-center pt-2">
        <p id="result" class="text-red-600 text-sm leading-relaxed font-semibold"></p>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>

</html>
